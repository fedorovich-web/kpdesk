name: Generate responsive images (temporary branch task)
on:
  push:
    branches: [fix/kpdesk-responsive-images-20261116]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install --disable-pip-version-check pillow==13.0.0
      - run: python frontend/scripts/generate-responsive-assets.py
      - name: Commit generated AVIFs to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/assets/hero/*-480w.avif frontend/public/assets/hero/*-800w.avif frontend/public/assets/icons/*-96w.avif frontend/public/assets/icons/*-144w.avif
          if git diff --cached --quiet; then
            echo "No new image variants"
          else
            git commit -m "perf: add optimized public AVIF sizes"
            git push origin HEAD:fix/kpdesk-responsive-images-20261116
          fi
