[project]
name = "kpdesk"
version = "0.1.0"
description = "Local-first quotation assistant for office consumables"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.15,<2",
    "defusedxml>=0.7.1,<1",
    "cryptography>=46,<51",
    "fastapi>=0.115,<1",
    "google-auth[requests]>=2.35,<3",
    "httpx>=0.28,<1",
    "jsonschema>=4.26,<5",
    "openpyxl>=3.1,<4",
    "pillow>=13,<14",
    "pypdf>=6,<7",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
    "pydantic-core>=2.46.5,<3",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "rapidfuzz>=3.14,<4",
    "reportlab>=4.2,<5",
    "scikit-learn>=1.7,<2",
    "joblib>=1.6,<2",
    "numpy>=2.5,<3",
    "starlette>=1.7,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "xlrd>=2.0.2,<3",
    "argon2-cffi>=23.1,<27",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1",
    "mypy>=1.18,<2",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl>=3.1.5.20260827",
    "scikit-learn-stubs>=0.0.3",
    "pytest-asyncio>=1.1,<2",
    "types-reportlab>=4.0",
    "pymupdf>=1.24,<2",
    "types-xlrd>=2.0,<3",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpdesk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = ["src", "typings"]

# Pin isolated native-build tools without changing application dependencies.
[tool.uv]
build-constraint-dependencies = [
    "meson-python==0.21.1",
    "cython==3.2.5",
    "meson==1.12.1",
    "ninja==1.13.2",
    "pyproject-metadata==0.12.1",
    "packaging==26.3",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "hatchling==1.33.0",
    "pathspec==1.1.1",
    "pluggy==1.7.0",
    "trove-classifiers==2026.9.21.13"
]
